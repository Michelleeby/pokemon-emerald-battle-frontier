name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/stage-5-verification-base]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Tests / select suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      suites: ${{ steps.selection.outputs.suites }}
      full: ${{ steps.selection.outputs.full }}
      has_suites: ${{ steps.selection.outputs.has_suites }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate suite manifest
        run: python3 tools/testing/validate_manifest.py

      - name: Test suite selector
        run: python3 -m unittest discover -s tools/testing -p 'test_*.py' -v

      - name: Select suites
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              python3 tools/testing/select_suites.py \
                --base "$BASE_SHA" \
                --head "$HEAD_SHA" \
                --github-output "$GITHUB_OUTPUT"
              ;;
            push)
              python3 tools/testing/select_suites.py \
                --base "$BEFORE_SHA" \
                --head "$PUSH_SHA" \
                --github-output "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              python3 tools/testing/select_suites.py \
                --files tests/manifest.json \
                --github-output "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

  build-tests:
    name: Tests / build gameplay ROMs
    needs: [select]
    if: ${{ needs.select.result == 'success' && needs.select.outputs.has_suites == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MGBA_REVISION: 26b7884bc25a5933960f3cdcd98bac1ae14d42e2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout pinned mGBA
        uses: actions/checkout@v6
        with:
          repository: mgba-emu/mgba
          ref: ${{ env.MGBA_REVISION }}
          path: mgba

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev cmake

      - name: Build test ROMs and mGBA runner
        run: |
          make -j"$(nproc)" test-roms
          cmake -S mgba -B mgba/build \
            -DBUILD_ROM_TEST=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF
          cmake --build mgba/build --target mgba-rom-test -j"$(nproc)"
          mkdir -p build/test/runtime
          cp -L mgba/build/libmgba.so.0.10 build/test/runtime/

      - name: Upload test bundle
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-test-bundle
          path: |
            build/test/roms/
            build/test/runtime/
            mgba/build/test/mgba-rom-test
          retention-days: 1

  run-suites:
    name: Tests / ${{ matrix.suite }}
    needs: [select, build-tests]
    if: ${{ needs.select.outputs.has_suites == 'true' && needs.build-tests.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout runner
        uses: actions/checkout@v6

      - name: Download test bundle
        uses: actions/download-artifact@v8
        with:
          name: gameplay-test-bundle

      - name: Deliberately exceed timeout for verification
        if: ${{ matrix.suite == 'frontier-tower' }}
        run: sleep 90

      - name: Run selected suite
        env:
          MGBA_ROM_TEST: ${{ github.workspace }}/mgba/build/test/mgba-rom-test
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/test/runtime
        run: |
          chmod +x "$MGBA_ROM_TEST"
          python3 tools/testing/run_tests.py --tests "${{ matrix.suite }}"

      - name: Upload suite diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-test-failure-${{ matrix.suite }}
          path: |
            build/test/artifacts/${{ matrix.suite }}/
            build/test/roms/${{ matrix.suite }}.elf
            build/test/roms/${{ matrix.suite }}.map
            build/test/roms/${{ matrix.suite }}.sym
          retention-days: 1

  cleanup-artifacts:
    name: Tests / delete test artifacts
    if: ${{ always() }}
    needs: [build-tests, run-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ARTIFACTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          artifact_list="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RUN_ARTIFACTS_URL?per_page=100" > "$artifact_list"
          while IFS= read -r artifact_id; do
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done < <(jq -r '.artifacts[].id' "$artifact_list")

  no-suites:
    name: Tests / no gameplay suites
    needs: [select]
    if: ${{ needs.select.result == 'success' && needs.select.outputs.has_suites == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "No gameplay suites selected; documentation-only gate passes."

  required:
    name: Tests / required
    if: ${{ always() }}
    needs: [select, build-tests, run-suites, no-suites, cleanup-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify test workflow results
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          BUILD_RESULT: ${{ needs.build-tests.result }}
          RUN_RESULT: ${{ needs.run-suites.result }}
          NO_SUITES_RESULT: ${{ needs.no-suites.result }}
          CLEANUP_RESULT: ${{ needs.cleanup-artifacts.result }}
          HAS_SUITES: ${{ needs.select.outputs.has_suites }}
          SELECTED_SUITES: ${{ needs.select.outputs.suites }}
        run: |
          if test "$SELECT_RESULT" != success; then
            echo "Suite selection failed with result: $SELECT_RESULT" >&2
            exit 1
          fi
          if test "$HAS_SUITES" = true; then
            echo "Selected gameplay suites: $SELECTED_SUITES"
            test "$BUILD_RESULT" = success || exit 1
            test "$RUN_RESULT" = success || exit 1
            test "$NO_SUITES_RESULT" = skipped || exit 1
            test "$CLEANUP_RESULT" = success || exit 1
          elif test "$HAS_SUITES" = false; then
            test "$BUILD_RESULT" = skipped || exit 1
            test "$RUN_RESULT" = skipped || exit 1
            test "$NO_SUITES_RESULT" = success || exit 1
          else
            echo "Selector emitted invalid has_suites value: $HAS_SUITES" >&2
            exit 1
          fi
