name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AGBCC_REVISION: da598c1d918402c42c0c0d7128ba14567f3175e9

jobs:
  prepare-agbcc:
    name: Build / prepare agbcc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore agbcc
        id: agbcc-cache
        uses: actions/cache/restore@v5
        with:
          path: tools/agbcc
          key: ${{ runner.os }}-${{ runner.arch }}-agbcc-${{ env.AGBCC_REVISION }}

      - name: Checkout agbcc
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: pret/agbcc
          ref: ${{ env.AGBCC_REVISION }}
          path: agbcc

      - name: Install agbcc dependencies
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Install agbcc
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ..

      - name: Save agbcc
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tools/agbcc
          key: ${{ runner.os }}-${{ runner.arch }}-agbcc-${{ env.AGBCC_REVISION }}

  build:
    name: Build / ${{ matrix.name }}
    needs: prepare-agbcc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: legacy
            target: all
          - name: modern
            target: modern
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore agbcc
        uses: actions/cache/restore@v5
        with:
          path: tools/agbcc
          key: ${{ runner.os }}-${{ runner.arch }}-agbcc-${{ env.AGBCC_REVISION }}
          fail-on-cache-miss: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build ${{ matrix.name }}
        run: make -j"$(nproc)" ${{ matrix.target }}

  required:
    name: Build / required
    if: ${{ always() }}
    needs: [prepare-agbcc, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify build results
        env:
          PREPARE_RESULT: ${{ needs.prepare-agbcc.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
